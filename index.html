<meta charset="utf-8">
<title>Plumb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Instrument+Sans:wght@500;600&display=swap">
<style>
/* Layout: an open dictionary on a dark desk. Left page: running head with the two guide words, a brass
   plumb bob hanging over the five letter plates, a typewriter strip and round typewriter keys.
   Right page: every guess filed in alphabetical order with a gap where the secret goes, plus your record.
   A thumb index runs down the page edge and lights up the letters still in play. On a phone the two
   pages stack. Single committed look: aged paper, oxblood ink, brass. */
:root {
  --desk: #2d3835;
  --desk2: #212b28;
  --paper: #f2e9d6;
  --paper2: #e8dcc3;
  --ink: #2a231e;
  --muted: #7b6c5a;
  --red: #93383a;
  --brass: #b9934b;
  --sage: #cfdcc8;
  --sage-ink: #2f4a33;
  --grain: none;
  --serif: 'IM Fell English', Georgia, 'Times New Roman', serif;
  --sc: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --ui: 'Instrument Sans', system-ui, 'Segoe UI', Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--desk2); }
body {
  margin: 0; color: var(--ink); font: 17px/1.45 var(--serif); min-height: 100dvh;
  background: radial-gradient(120% 90% at 50% 0%, #3b4944, var(--desk) 55%, var(--desk2));
  padding-block: 14px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }
.sc { font-family: var(--sc); letter-spacing: 0.08em; }

.motes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.motes i { position: absolute; border-radius: 50%; background: #f6e8c4; opacity: 0; animation: drift var(--t) ease-in-out var(--d) infinite; }
.desk { position: relative; z-index: 1; max-width: 1640px; margin: 0 auto; display: grid; gap: 14px; }

/* ---------- desk bar ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; color: #f2e9d6; }
.bar h1 { font: italic 400 clamp(2rem, 5vw, 2.8rem)/1 var(--serif); letter-spacing: 0.01em; }
.bar .sub { font: 400 0.82rem/1.2 var(--sc); letter-spacing: 0.1em; color: #b9b19c; margin-top: 4px; }
.tools { display: flex; align-items: center; gap: 14px; }
.tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; }
.tabs button { background: none; border: 0; cursor: pointer; padding: 8px 14px 10px; font: 400 0.95rem/1 var(--sc); letter-spacing: 0.1em; color: #b9b19c; transition: color 0.4s; }
.tabs button[aria-pressed="true"] { color: #f6eedb; }
.tabs .ul { position: absolute; left: 0; bottom: 0; height: 2px; width: 50%; background: var(--brass); transition: transform 0.7s var(--ease); }
.tabs[data-m="endless"] .ul { transform: translateX(100%); }
.help { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #6b7a74; background: transparent; color: #f2e9d6; cursor: pointer; font: italic 400 1.1rem/1 var(--serif); transition: background 0.3s, border-color 0.3s; }
.help:hover { background: rgba(185, 147, 75, 0.25); border-color: var(--brass); }

/* ---------- the book ---------- */
.book { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: calc(100dvh - 118px); filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.45)); }
.page {
  position: relative; min-width: 0; display: flex; flex-direction: column; gap: 14px;
  padding: clamp(16px, 2vw, 30px) clamp(20px, 3.2vw, 52px);
  background: var(--grain), radial-gradient(120% 90% at 20% 0%, #f8f0de, var(--paper) 55%, #eadfc6);
  box-shadow: 0 1px 0 #d8cdb2, 0 2px 0 #cdc1a3, 0 3px 0 #d8cdb2, 0 4px 0 #c6b99a;
}
.play { border-radius: 10px 0 0 10px; box-shadow: inset -34px 0 34px -26px rgba(70, 45, 20, 0.4), 0 1px 0 #d8cdb2, 0 2px 0 #cdc1a3, 0 3px 0 #d8cdb2, 0 4px 0 #c6b99a; }
.leaf { border-radius: 0 10px 10px 0; padding-right: clamp(46px, 5vw, 70px); box-shadow: inset 34px 0 34px -26px rgba(70, 45, 20, 0.4), 0 1px 0 #d8cdb2, 0 2px 0 #cdc1a3, 0 3px 0 #d8cdb2, 0 4px 0 #c6b99a; }
.play > *, .leaf > * { width: 100%; max-width: 620px; margin-inline: auto; }

/* running head */
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 12px; padding-bottom: 8px; border-bottom: 3px double rgba(42, 35, 30, 0.55); }
.gw { display: grid; gap: 2px; min-width: 0; }
.gw.r { text-align: right; }
.gw .w { font: 400 clamp(1.7rem, min(5vw, 5.4vh), 2.6rem)/1.05 var(--serif); color: var(--red); overflow-wrap: anywhere; }
.gw .w.open { color: var(--muted); font-style: italic; }
.gw .cap { font: 400 0.72rem/1 var(--sc); letter-spacing: 0.14em; color: var(--muted); }
.folio { font: italic 400 0.95rem/1 var(--serif); color: var(--muted); padding-bottom: 6px; }

/* margin note */
.coach { border-left: 2px solid var(--red); padding: 2px 0 2px 14px; min-height: 3.9rem; display: grid; align-content: center; gap: 3px; transition: border-color 0.5s; }
.coach h2 { font: 400 1.05rem/1.2 var(--sc); letter-spacing: 0.08em; }
.coach p { font: italic 400 1rem/1.35 var(--serif); color: var(--muted); }
.coach.warn { border-left-color: var(--brass); }
.coach.warn h2 { color: var(--red); }

/* plumb bob */
.pendwrap { position: relative; display: grid; justify-items: center; flex: 0 0 auto; margin-block: -4px; }
.swing, .pend { transform-origin: 50% 3%; }
.pend { animation: sway 7s ease-in-out infinite alternate; }
.bobsvg { display: block; height: clamp(84px, 15vh, 160px); width: auto; filter: drop-shadow(0 6px 5px rgba(60, 40, 20, 0.25)); }
.ting { position: absolute; left: 50%; bottom: 2px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; border: 1.5px solid var(--brass); opacity: 0; pointer-events: none; }

/* letter plates */
.mid { display: grid; gap: 10px; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(6px, 1.2vw, 12px); }
.slot {
  position: relative; height: clamp(60px, 11vh, 100px); border-radius: 6px; background: var(--paper2);
  box-shadow: inset 0 2px 5px rgba(70, 45, 20, 0.3), inset 0 -1px 0 rgba(255, 255, 255, 0.7);
  display: grid; place-items: center; font: 400 clamp(2rem, 6vh, 3.2rem)/1 var(--serif); text-transform: uppercase; color: rgba(123, 108, 90, 0.7);
  transition: background-color 0.8s var(--ease), color 0.8s var(--ease), box-shadow 0.8s var(--ease);
}
.slot.cur { box-shadow: inset 0 2px 5px rgba(70, 45, 20, 0.3), 0 0 0 1.5px var(--red); }
.slot.lock { background: #efdac6; color: var(--red); }
.slot.on { background: #f6efdd; color: var(--ink); }
.slot.win { background: var(--sage); color: var(--sage-ink); }
.slot .tg { position: absolute; left: 0; right: 0; text-align: center; font: italic 400 0.7rem/1 var(--serif); color: var(--muted); text-transform: none; white-space: nowrap; }
.slot .tg.t { top: 7px; } .slot .tg.b { bottom: 7px; }
.slot.cur .tg { color: var(--red); }
.note { font: italic 400 1rem/1.35 var(--serif); color: var(--muted); min-height: 1.4em; text-align: center; }

/* typing */
.entry { display: grid; gap: 12px; }
.count { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count .cap { font: 400 0.82rem/1 var(--sc); letter-spacing: 0.12em; color: var(--muted); }
.dots { display: flex; gap: 7px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); display: block; transition: background-color 0.5s var(--ease), border-color 0.5s; }
.dots i.used { background: var(--muted); }
.dots i.hit { background: #5d8561; border-color: #5d8561; }
.skip { background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); cursor: pointer; padding: 4px; font: italic 400 0.95rem var(--serif); }
.typing { display: grid; gap: 14px; }
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(8px, 1.6vw, 16px); padding: 0 6px; }
.tile { height: clamp(40px, 6vh, 56px); border-bottom: 2px solid rgba(42, 35, 30, 0.7); display: grid; place-items: center; transition: border-color 0.3s; }
.tile span { display: block; font: 400 clamp(1.8rem, 5vh, 2.5rem)/1 var(--serif); text-transform: uppercase; transform: rotate(var(--r, 0deg)); }
.tile.next { border-bottom-color: var(--red); animation: caret 1.5s ease-in-out infinite; }
.kb { display: grid; gap: 8px; width: 100%; max-width: 560px; margin-inline: auto; }
.kb .r { display: flex; gap: 5px; justify-content: center; align-items: stretch; }
.key {
  flex: 1 1 0; min-width: 0; max-width: 52px; aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 35% 28%, #fdf8ec, #e7dbc1 72%); color: var(--ink);
  font: 400 clamp(1rem, 4.4vw, 1.3rem)/1 var(--serif); text-transform: uppercase;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55), 0 0 0 2px #3a322c, 0 4px 0 2px #1f1a17;
  transition: transform 0.16s var(--ease), box-shadow 0.16s var(--ease);
}
.key:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55), 0 0 0 2px #3a322c, 0 1px 0 2px #1f1a17; }
.key.wide { flex: 1.9 1 0; max-width: none; aspect-ratio: auto; border-radius: 999px; font: 400 0.92rem/1 var(--sc); letter-spacing: 0.08em; text-transform: none; }
.key.go { background: radial-gradient(circle at 35% 28%, #ecd7a0, #bd9a52 78%); }
.key:disabled { opacity: 0.4; cursor: not-allowed; }
.kb { margin-bottom: 6px; }

/* ---------- result ---------- */
.result { display: grid; gap: 12px; }
.stamp { justify-self: start; font: 400 clamp(1.5rem, 4.6vw, 2.2rem)/1 var(--sc); letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); border: 3px double var(--red); padding: 0.4em 0.7em 0.3em; transform: rotate(-5deg); filter: url(#rough); mix-blend-mode: multiply; opacity: 0.93; }
.stamp.lost { color: var(--muted); border-color: var(--muted); }
.result p { color: var(--muted); font-style: italic; }
.result pre { margin: 0; font: 500 1.02rem/1.55 var(--ui); letter-spacing: 0.08em; background: var(--paper2); border-radius: 4px; padding: 10px 14px; white-space: pre-wrap; user-select: all; box-shadow: inset 0 1px 3px rgba(70, 45, 20, 0.25); }
.result .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { height: 42px; padding: 0 20px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--paper); font: 400 0.95rem/1 var(--sc); letter-spacing: 0.1em; cursor: pointer; transition: background-color 0.3s, color 0.3s, transform 0.4s var(--ease); }
.btn:hover { background: #4a3d33; transform: translateY(-1px); }
.btn.alt { background: transparent; color: var(--ink); }
.btn.alt:hover { background: rgba(42, 35, 30, 0.08); }
.nextin { font: 500 0.82rem var(--ui); font-variant-numeric: tabular-nums; color: var(--muted); }

/* ---------- right page ---------- */
.leaf h2 { font: 400 1.3rem/1 var(--sc); letter-spacing: 0.14em; padding-bottom: 8px; border-bottom: 3px double rgba(42, 35, 30, 0.55); }
.legend { font-size: 0.92rem; font-style: italic; color: var(--muted); line-height: 1.4; }
.entries { list-style: none; padding: 0; display: grid; align-content: start; }
.ent { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0 9px 12px; border-bottom: 1px dotted rgba(123, 108, 90, 0.6); border-left: 3px solid transparent; }
.ent .hw { font: 400 clamp(1.4rem, 2.6vw, 1.75rem)/1.1 var(--serif); letter-spacing: 0.01em; }
.ent .hw .l { position: relative; font-style: normal; display: inline-block; }
.ent .hw .l.lock { color: var(--red); }
.ent .hw .l.dec::after { content: ""; position: absolute; inset: -1px -4px; border: 1.5px solid var(--red); border-radius: 54% 46% 52% 48% / 48% 54% 46% 52%; transform: rotate(-4deg); }
.ent .mt { font: italic 400 0.88rem/1.2 var(--serif); color: var(--muted); text-align: right; }
.ent .mt em { display: block; color: var(--red); font-style: italic; }
.ent.guide { border-left-color: var(--red); }
.ent.found .hw { background: linear-gradient(transparent 58%, var(--sage) 58%); }
.ent.found .mt { color: var(--sage-ink); }
.ent.gap { background: linear-gradient(90deg, rgba(147, 56, 58, 0.09), transparent 80%); border-bottom: 1px dotted rgba(147, 56, 58, 0.6); }
.ent.gap .hw { display: inline-flex; gap: 6px; }
.ent.gap .hw i { width: 1.15rem; height: 1.25rem; border-bottom: 1.5px solid var(--red); display: block; animation: breathe 2.6s ease-in-out infinite; }
.ent.gap .hw i:nth-child(2) { animation-delay: 0.15s; } .ent.gap .hw i:nth-child(3) { animation-delay: 0.3s; } .ent.gap .hw i:nth-child(4) { animation-delay: 0.45s; } .ent.gap .hw i:nth-child(5) { animation-delay: 0.6s; }
.ent.gap.show .hw { color: var(--red); }
.ent.gap .mt { color: var(--red); }
.sec { display: grid; gap: 12px; margin-top: 8px; }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nums div { border-top: 2px solid rgba(42, 35, 30, 0.6); padding-top: 6px; }
.nums dt { font: 400 0.74rem/1 var(--sc); letter-spacing: 0.12em; color: var(--muted); }
.nums dd { margin-top: 4px; font: 400 2rem/1 var(--serif); font-variant-numeric: tabular-nums; }
.dist { display: grid; gap: 5px; }
.dist div { display: grid; grid-template-columns: 1.1rem minmax(0, 1fr); gap: 8px; align-items: center; font: 400 0.95rem var(--serif); color: var(--muted); }
.dist i { display: block; height: 16px; min-width: 24px; border-radius: 2px 6px 6px 2px; background: rgba(123, 108, 90, 0.45); color: var(--ink); font: 500 0.74rem/16px var(--ui); font-style: normal; text-align: right; padding-right: 6px; transform-origin: left; }
.dist i.today { background: var(--red); color: var(--paper); }

/* thumb index */
.idx { position: absolute; top: 74px; bottom: 74px; right: 0; width: 26px; display: flex; flex-direction: column; z-index: 2; }
.idx i { flex: 1 1 0; display: grid; place-items: center; font: 400 0.66rem/1 var(--sc); font-style: normal; color: var(--muted); background: rgba(123, 108, 90, 0.14); border-radius: 12px 0 0 12px; margin-block: 1px; transition: background-color 0.7s var(--ease), color 0.7s var(--ease), transform 0.7s var(--ease); }
.idx i.on { background: var(--red); color: var(--paper); transform: translateX(-4px); }
.play .idx { display: none; }

/* ---------- how to play ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20, 26, 24, 0.62); display: grid; place-items: center; padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); animation: fade 0.4s ease both; }
.how { --loop: 14s; background: var(--grain), var(--paper); border-radius: 8px; width: 100%; max-width: 500px; max-height: 100%; overflow: auto; padding: 24px; display: grid; gap: 16px; box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px rgba(42, 35, 30, 0.5), 0 30px 80px -20px rgba(0, 0, 0, 0.7); animation: rise 0.7s var(--ease) both; }
.how h2 { font: 400 1.9rem/1 var(--sc); letter-spacing: 0.1em; }
.how .intro { color: var(--muted); font-style: italic; }
.how ol { list-style: none; padding: 0; display: grid; gap: 12px; counter-reset: s; }
.how li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; opacity: 0.5; animation: var(--sa) var(--loop) ease-in-out infinite; font-size: 1rem; }
.how li::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--red); color: var(--red); display: grid; place-items: center; font: 400 0.95rem var(--serif); }
.how li:nth-child(1) { --sa: stepA; } .how li:nth-child(2) { --sa: stepB; } .how li:nth-child(3) { --sa: stepC; }
.how li b { font-weight: 400; font-family: var(--sc); letter-spacing: 0.06em; }
.how .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.how .foot p { color: var(--muted); font-size: 0.92rem; font-style: italic; flex: 1 1 12rem; }
.how .btn { background: var(--red); border-color: var(--red); color: #f8efe0; }
.how .btn:hover { background: #7a2d2f; }
.demo { background: var(--paper2); border-radius: 6px; padding: 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; box-shadow: inset 0 2px 6px rgba(70, 45, 20, 0.25); }
.demo .dr { position: relative; height: 156px; border-left: 2px solid rgba(42, 35, 30, 0.5); margin: 4px 0 0 8px; }
.demo .dw { position: absolute; left: -2px; width: 10px; border-radius: 5px; background: var(--red); animation: dWin var(--loop) cubic-bezier(0.45, 0, 0.2, 1) infinite both; }
.demo .dm { position: absolute; left: 14px; transform: translateY(-50%); font: 400 0.76rem/1 var(--serif); background: var(--paper); color: var(--ink); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; opacity: 0; box-shadow: 0 1px 2px rgba(70, 45, 20, 0.3); }
.demo .m1 { top: var(--s); animation: dMk1 var(--loop) ease-in-out infinite both; } .demo .m2 { top: var(--d); animation: dMk2 var(--loop) ease-in-out infinite both; } .demo .m3 { top: var(--f); background: var(--sage); color: var(--sage-ink); animation: dMk3 var(--loop) ease-in-out infinite both; }
.demo .ds { display: grid; gap: 8px; }
.demo .dwd { position: relative; height: 2.3rem; font: 400 2.1rem/1 var(--serif); color: var(--red); text-transform: capitalize; }
.demo .dwd span { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; }
.demo .lo .a { animation: dLoA var(--loop) ease-in-out infinite both; } .demo .lo .b { animation: dLoB var(--loop) ease-in-out infinite both; }
.demo .hi .a { animation: dHiA var(--loop) ease-in-out infinite both; } .demo .hi .b { animation: dHiB var(--loop) ease-in-out infinite both; }
.demo .dsl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.demo .dsl b { height: 40px; border-radius: 5px; background: rgba(255, 250, 238, 0.5); box-shadow: inset 0 2px 4px rgba(70, 45, 20, 0.3); display: grid; place-items: center; font: 400 1.3rem var(--serif); color: transparent; animation: dSl var(--loop) ease-in-out infinite both; }
.demo .dsl b:nth-child(2) { animation-delay: 0.1s; } .demo .dsl b:nth-child(3) { animation-delay: 0.2s; } .demo .dsl b:nth-child(4) { animation-delay: 0.3s; } .demo .dsl b:nth-child(5) { animation-delay: 0.4s; }
.demo .dst { position: relative; height: 1.3rem; font: italic 400 0.95rem var(--serif); }
.demo .dst span { position: absolute; left: 0; opacity: 0; white-space: nowrap; }
.demo .s0 { animation: dS0 var(--loop) ease-in-out infinite both; } .demo .s1 { animation: dS1 var(--loop) ease-in-out infinite both; }
.demo .s2 { animation: dS2 var(--loop) ease-in-out infinite both; } .demo .s3 { animation: dS3 var(--loop) ease-in-out infinite both; color: var(--sage-ink); }

/* ---------- keyframes ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(22px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes sway { from { transform: rotate(-1.1deg); } to { transform: rotate(1.1deg); } }
@keyframes caret { 0%, 100% { border-bottom-color: rgba(42, 35, 30, 0.7); } 50% { border-bottom-color: var(--red); } }
@keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes drift { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.35; } 80% { opacity: 0.25; } 100% { opacity: 0; transform: translate(var(--x), -90px); } }
@keyframes stepA { 0%, 28% { opacity: 1; } 34%, 100% { opacity: 0.5; } }
@keyframes stepB { 0%, 28% { opacity: 0.5; } 34%, 62% { opacity: 1; } 68%, 100% { opacity: 0.5; } }
@keyframes stepC { 0%, 62% { opacity: 0.5; } 68%, 94% { opacity: 1; } 99%, 100% { opacity: 0.5; } }
@keyframes dLoA { 0%, 42% { opacity: 1; } 47%, 100% { opacity: 0; } }
@keyframes dLoB { 0%, 42% { opacity: 0; } 47%, 93% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes dHiA { 0%, 12% { opacity: 1; } 17%, 100% { opacity: 0; } }

<script>
// Plumb rules. No DOM in here, so the same file runs in the page and in node.

const EPOCH = '2026-11-09';
const MAX = 8;
const LEN = 5;

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function dateKey(d) {
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function dayNumber(key) {
  const [y, m, d] = key.split('-').map(Number);
  const [ey, em, ed] = EPOCH.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ey, em - 1, ed)) / 86400000) + 1;
}

// Letters two words have in common, any position, each letter counted as often as both words hold it.
function sharedLetters(a, b) {
  const c = {};
  for (const ch of b) c[ch] = (c[ch] || 0) + 1;
  let n = 0;
  for (const ch of a) if (c[ch] > 0) { n++; c[ch]--; }
  return n;
}

// 1 when the secret comes later in the dictionary than the guess, -1 earlier, 0 on a match.
function plumbCompare(g, s) { return g === s ? 0 : (g < s ? 1 : -1); }

// The guide words: the nearest guesses on either side of the secret.
function plumbGuides(guesses, secret) {
  let lo = null, hi = null;
  for (const g of guesses) {
    if (g < secret && (lo === null || g > lo)) lo = g;
    if (g > secret && (hi === null || g < hi)) hi = g;
  }
  return { lo, hi };
}

function pickSecret(seed, list) { return list[hashStr('plumb/' + seed) % list.length]; }

function lowerBound(list, w) {
  let a = 0, b = list.length;
  while (a < b) { const m = (a + b) >> 1; if (list[m] < w) a = m + 1; else b = m; }
  return a;
}

function commonPrefix(a, b) {
  let i = 0;
  while (i < a.length && a[i] === b[i]) i++;
  return i;
}

// What the guesses so far prove about the secret's letters: the leading letters that are settled,
// and for the first unsettled letter, the nearest letters it must come after and before.
function plumbKnown(guesses, secret) {
  let k = 0;
  for (const g of guesses) k = Math.max(k, commonPrefix(g, secret));
  if (k >= secret.length) return { k: secret.length, letters: secret.split(''), after: null, before: null };
  let after = null, before = null;
  for (const g of guesses) {
    if (commonPrefix(g, secret) !== k) continue;
    const c = g[k];
    if (c < secret[k]) { if (after === null || c > after) after = c; }
    else if (c > secret[k]) { if (before === null || c < before) before = c; }
  }
  return { k, letters: secret.slice(0, k).split(''), after, before };
}

// One glyph per guess: later, earlier, found.
function glyphs(guesses, secret) {
  return guesses.map((g) => {
    const c = plumbCompare(g, secret);
    return c === 0 ? '\u25C6' : (c > 0 ? '\u25BC' : '\u25B2');
  }).join('');
}

function shareText(dayNo, guesses, secret) {
  const won = guesses.indexOf(secret) >= 0;
  return 'PLUMB No. ' + dayNo + '  ' + (won ? guesses.length : 'X') + '/' + MAX + '\n' + glyphs(guesses, secret);
}

if (typeof module !== 'undefined') {
  module.exports = { EPOCH, MAX, LEN, hashStr, dateKey, dayNumber, sharedLetters, plumbCompare,
    plumbGuides, pickSecret, lowerBound, commonPrefix, plumbKnown, glyphs, shareText };
}

</script>

    if (typed.length === LEN) return setCoach(up(typed), 'Press Plumb to check it.');
    if (!n) return setCoach('Type any five-letter word', 'A secret word is filed somewhere in the dictionary. Each guess tells you which way to look, and how many letters you share.');
    var c = plumbCompare(last, secret), sh = sharedLetters(last, secret), g = plumbGuides(guesses, secret);
    setCoach(up(last) + ': ' + (c > 0 ? 'later' : 'earlier') + ', ' + sh + (sh === 1 ? ' letter' : ' letters') + ' shared',
      'The secret is now ' + (g.lo ? 'after ' + up(g.lo) : '') + (g.lo && g.hi ? ' and ' : '') + (g.hi ? 'before ' + up(g.hi) : '') + '. ' + left + (left === 1 ? ' guess left.' : ' guesses left.'));
  }

  function bad(t, b) {
    anim($('tiles'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }], { duration: 420, easing: 'ease-in-out' });
    setCoach(t, b, true);
  }
  function submit() {
    if (typed.length !== LEN) return bad('Needs five letters', 'Type a five-letter word, then press Plumb.');
    if (!VALID.has(typed)) return bad(up(typed) + ' is not in the word list', 'Try a more common word. Names and slang are left out.');
    if (guesses.indexOf(typed) >= 0) return bad('Already tried', 'You already plumbed ' + up(typed) + '. Pick a different word.');
    guesses.push(typed);
    var g = typed, r = round(); r.g = guesses.slice(); typed = '';
    var w = won(), over = w || guesses.length >= MAX;
    if (over && !r.rec) { r.rec = true; applyStat(); }
    save();
    renderAll(guesses.length - 1, false);
    swing(g);
    if (w) ting();
    if (over) result(w ? 2300 : 2200);
  }

  /* ---------- entries, filed in dictionary order ---------- */
  var DOWN = '↓', UPA = '↑';
  function renderEntries(fresh) {
    var ol = $('entries'), before = {};
    if (fresh >= 0) [].forEach.call(ol.children, function (li) { if (li.getAttribute('data-w')) before[li.getAttribute('data-w')] = li.getBoundingClientRect().top; });
    var w = won(), dn = done(), g = plumbGuides(guesses, secret), items = guesses.slice();
    if (!w) items.push(secret);
    items.sort();
    var h = '';
    items.forEach(function (wd) {
      if (wd === secret && !w) {
        var blanks = '', i;
        if (dn) { for (i = 0; i < LEN; i++) blanks += '<i class="l" style="font-style:normal;border:0;width:auto;height:auto;animation:none">' + wd[i] + '</i>'; }
        else for (i = 0; i < LEN; i++) blanks += '<i></i>';
        h += '<li class="ent gap' + (dn ? ' show' : '') + '" data-w="~gap"><span class="hw">' + blanks + '</span><span class="mt">' + (dn ? 'the word' : 'the word belongs here') + '</span></li>';
        return;
      }
      var c = plumbCompare(wd, secret), sh = sharedLetters(wd, secret), p = commonPrefix(wd, secret), letters = '';
      for (var k = 0; k < LEN; k++) letters += '<i class="l' + (k < p ? ' lock' : '') + (k === p && c !== 0 ? ' dec' : '') + '">' + wd[k] + '</i>';
      var mt = c === 0 ? 'found it' : 'shares ' + sh + (sh === 1 ? ' letter' : ' letters') + '<em>' + (c > 0 ? DOWN + ' later' : UPA + ' earlier') + '</em>';
      h += '<li class="ent' + (c === 0 ? ' found' : '') + ((!w && (wd === g.lo || wd === g.hi)) ? ' guide' : '') + '" data-w="' + wd + '"><span class="hw">' + letters + '</span><span class="mt">' + mt + '</span></li>';
    });
    ol.innerHTML = h;
    if (fresh >= 0) {
      var newW = guesses[fresh];
      [].forEach.call(ol.children, function (li) {
        var key = li.getAttribute('data-w');
        if (key === newW) {
          anim(li.querySelector('.hw'), [{ opacity: 0, letterSpacing: '0.4em', filter: 'blur(2px)' }, { opacity: 1, letterSpacing: '0.01em', filter: 'blur(0)' }], { duration: 1000, delay: 500, easing: 'cubic-bezier(0.3, 0, 0.1, 1)' });
          anim(li.querySelector('.mt'), FADE_UP, { duration: 700, delay: 900 });
        } else if (before[key] != null) {
          var dy = before[key] - li.getBoundingClientRect().top;
          if (Math.abs(dy) > 1) anim(li, [{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: 900, delay: 350, easing: 'cubic-bezier(0.5, 0, 0.1, 1)' });
        }
      });
    }
  }

  /* ---------- result and record ---------- */
  function copyText(text, btn, pre) {
    function ok() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy result'; }, 1800); }
    function fail() { try { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} btn.textContent = 'Press copy now'; setTimeout(function () { btn.textContent = 'Copy result'; }, 2500); }
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
  }
  function result(delay) {
    clearTimeout(resTimer);
    var box = $('resBox');
    if (!done()) { box.innerHTML = ''; $('typing').hidden = false; return; }
    function fill() {
      var w = won(), daily = mode === 'daily', n = guesses.length, share = daily ? shareText(dayNo, guesses, secret) : '';
      $('typing').hidden = true;
      box.innerHTML = '<section class="result" id="res"><div class="stamp' + (w ? '' : ' lost') + '" id="stamp">' + (w ? 'Plumbed' : 'Not this time') + '</div>' +
        '<p>' + (w ? 'The word was ' + up(secret) + '. You found it on guess ' + n + ' of ' + MAX + '.' : 'The word was ' + up(secret) + '.' + (daily ? ' A new word is filed at midnight.' : '')) + '</p>' +
        (daily ? '<pre id="sharePre"></pre>' : '') +
        '<div class="acts"><button type="button" class="btn" id="b1"></button>' + (daily ? '<button type="button" class="btn alt" id="b2">Play endless</button>' : '<button type="button" class="btn alt" id="b2">Back to daily</button>') +
        (daily ? '<span class="nextin" id="nextin"></span>' : '') + '</div></section>';
      if (daily) $('sharePre').textContent = share;
      var b1 = $('b1');
      if (daily) { b1.textContent = 'Copy result'; b1.onclick = function () { copyText(share, b1, $('sharePre')); }; }
      else { b1.textContent = 'Next word'; b1.onclick = newRound; }
      $('b2').onclick = function () { go(daily ? 'endless' : 'daily'); };
      anim($('stamp'), [{ opacity: 0, transform: 'scale(1.9) rotate(-14deg)' }, { opacity: 0.93, transform: 'scale(1) rotate(-5deg)' }], { duration: 520, easing: 'cubic-bezier(0.3, 0, 0.1, 1)' });
      anim($('res').querySelector('p'), FADE_UP, { duration: 600, delay: 400 });
      if (daily) anim($('sharePre'), FADE_UP, { duration: 600, delay: 550 });
      anim($('res').querySelector('.acts'), FADE_UP, { duration: 600, delay: 700 });
      anim($('book') || document.querySelector('.book'), [{ transform: 'translateY(0)' }, { transform: 'translateY(2px)' }, { transform: 'translateY(0)' }], { duration: 260, delay: 480, easing: 'ease-out' });
      tick();
    }
    if (delay > 0 && !reduce) resTimer = setTimeout(fill, delay); else fill();
  }
  function renderRecord(a) {
    var st = stats(), daily = mode === 'daily';
    $('recT').textContent = 'Record · ' + (daily ? 'Daily' : 'Endless');
    var streak = daily ? (st.lastWin >= dayNo - 1 ? st.streak : 0) : st.streak;
    $('nums').innerHTML = '<div><dt>Played</dt><dd>' + st.played + '</dd></div><div><dt>Found</dt><dd>' + (st.played ? Math.round(st.won / st.played * 100) : 0) + '%</dd></div><div><dt>Streak</dt><dd>' + streak + '</dd></div><div><dt>Best</dt><dd>' + st.best + '</dd></div>';
    var mx = Math.max.apply(null, st.dist.concat([1])), h = '', today = done() && won() ? guesses.length - 1 : -1;
    for (var i = 0; i < MAX; i++) h += '<div><b style="font-weight:400">' + (i + 1) + '</b><i class="' + (i === today ? 'today' : '') + '" style="width:' + Math.max(8, Math.round(st.dist[i] / mx * 100)) + '%">' + st.dist[i] + '</i></div>';
    $('dist').innerHTML = h;
    if (a) $('dist').querySelectorAll('i').forEach(function (b, i) { anim(b, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 900, delay: i * 60 }); });
  }

  function renderAll(fresh, quiet) {
    var d = done(), a = !quiet && fresh >= 0;
    renderEntries(fresh); renderHead(a); renderIndex(); renderTiles(-1);
    var dots = '';
    for (var i = 0; i < MAX; i++) dots += '<i class="' + (i < guesses.length ? (guesses[i] === secret ? 'hit' : 'used') : '') + '"></i>';
    $('dots').innerHTML = dots;
    if (a) anim($('dots').children[guesses.length - 1], [{ transform: 'scale(0.3)' }, { transform: 'scale(1)' }], { duration: 700, delay: 500 });
    $('cnt').textContent = d ? 'Finished' : 'Guess ' + (guesses.length + 1) + ' of ' + MAX;
    $('skip').hidden = !(mode === 'endless' && !d && guesses.length > 0);
    document.querySelectorAll('.key').forEach(function (k) { k.disabled = d; });
    $('sub').textContent = mode === 'daily' ? 'Word No. ' + dayNo + ' · ' + dateWords() : 'Round ' + (store.se.played + (d ? 0 : 1)) + ' · ' + store.se.won + ' found';
    coach(); renderRecord(quiet || d);
    if (quiet || fresh < 0) result(0);
  }

  function newRound() {
    store.e = { seed: seed(), g: [], rec: false }; save();
    $('resBox').innerHTML = '';
    init('endless');
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }
  $('skip').addEventListener('click', newRound);

  /* ---------- how to play ---------- */
  function howHtml() {
    var s = (rank('stone') * 100).toFixed(1) + '%', d = (rank('drift') * 100).toFixed(1) + '%', f = (rank('flask') * 100).toFixed(1) + '%';
    return '<h2 id="howT">How to play</h2>' +
      '<p class="intro">A secret five-letter word is filed somewhere in the dictionary. Find it in eight guesses.</p>' +
      '<div class="demo" aria-hidden="true" style="--s:' + s + ';--d:' + d + ';--f:' + f + '"><div class="dr"><div class="dw"></div><div class="dm m1">1</div><div class="dm m2">2</div><div class="dm m3">3</div></div>' +
      '<div class="ds"><div class="dwd lo"><span class="a">A…</span><span class="b">Drift</span></div><div class="dsl"><b>F</b><b>L</b><b>A</b><b>S</b><b>K</b></div><div class="dwd hi"><span class="a">…Z</span><span class="b">Stone</span></div>' +
      '<div class="dst"><span class="s0">Secret word: ? ? ? ? ?</span><span class="s1">STONE: earlier, 1 letter shared</span><span class="s2">DRIFT: later, 1 letter shared</span><span class="s3">FLASK: found on guess 3</span></div></div></div>' +
      '<ol><li><span><b>Type a word.</b> Any real five-letter word. Start with something ordinary.</span></li>' +
      '<li><span><b>Press Plumb.</b> The brass bob swings toward the secret. You learn whether it comes earlier or later in the dictionary, and how many letters you share.</span></li>' +
      '<li><span><b>Read the page.</b> Your two closest guesses become the guide words at the top. When guesses start with the same letters, those plates lock in, and the next plate tells you which letter it comes after and before.</span></li></ol>' +
      '<div class="foot"><p>Daily gives everyone the same word. Endless gives you a new one every round.</p><button type="button" class="btn" id="howGo">Start playing</button></div>';
  }
  function openHow() {
    $('how').innerHTML = howHtml(); $('ov').hidden = false; store.seen = true; save();
    $('howGo').addEventListener('click', closeHow); $('howGo').focus({ preventScroll: true });
  }
  function closeHow() {
    var ov = $('ov');
    function fin() { ov.hidden = true; $('how').innerHTML = ''; try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {} }
    var a = anim(ov, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-out', fill: 'forwards' });
    if (a) a.onfinish = function () { a.cancel(); fin(); }; else fin();
  }
  $('helpBtn').addEventListener('click', openHow);
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeHow(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('ov').hidden) closeHow(); });

  /* ---------- routing and clock ---------- */
  function go(m) { init(m); try { location.hash = m; } catch (e) {} }
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if ((h === 'daily' || h === 'endless') && h !== mode) init(h); });
  $('mDaily').addEventListener('click', function () { go('daily'); });
  $('mEndless').addEventListener('click', function () { go('endless'); });
  function tick() {
    var now = new Date(), k = dateKey(now);
    if (k !== todayKey) { todayKey = k; dayNo = dayNumber(k); store.d = null; save(); if (mode === 'daily') init('daily'); return; }
    var el = $('nextin'); if (!el) return;
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), s = Math.max(0, Math.floor((next - now) / 1000)), p = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = 'Next word in ' + p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
  }
  setInterval(tick, 1000);

  buildKb(); buildTiles(); buildSlots(); buildIndex();
  var h0 = location.hash.replace('#', '');
  init(h0 === 'endless' ? 'endless' : 'daily');
  if (!store.seen) setTimeout(function () { if (!store.seen) openHow(); }, 350);
})();
</script>
